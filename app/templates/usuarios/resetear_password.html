{% extends "base.html" %}
{% block titulo %}Resetear contraseña{% endblock %}
{% block contenido %}
<div class="tarjeta">
  <h2>Resetear contraseña de {{ usuario['nombre'] }}</h2>
  <form method="post">
    <label for="password">Nueva contraseña</label>
    <input type="password" id="password" name="password" autofocus>

    <label for="confirmar">Confirma la nueva contraseña</label>
    <input type="password" id="confirmar" name="confirmar">

    <button type="submit">Guardar</button>
    <a class="boton secundario" href="{{ url_for('usuarios.listado') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
