{% extends "base.html" %}
{% block titulo %}Nuevo usuario{% endblock %}
{% block contenido %}
<div class="tarjeta">
  <h2>Nuevo usuario</h2>
  <form method="post">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" value="{{ nombre }}" autofocus>

    <label for="rol">Rol</label>
    <select id="rol" name="rol">
      <option value="operador" {% if rol == 'operador' %}selected{% endif %}>Operador (solo Salida/Retorno)</option>
      <option value="admin" {% if rol == 'admin' %}selected{% endif %}>Admin (control total)</option>
    </select>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password">

    <label for="confirmar">Confirma la contraseña</label>
    <input type="password" id="confirmar" name="confirmar">

    <button type="submit">Crear usuario</button>
    <a class="boton secundario" href="{{ url_for('usuarios.listado') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
