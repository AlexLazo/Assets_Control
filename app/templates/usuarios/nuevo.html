{% extends "base.html" %}
{% block titulo %}Nuevo usuario{% endblock %}
{% block contenido %}
<div class="tarjeta">
  <h2>Nuevo usuario</h2>
  <form method="post" style="max-width:460px;">
    <label for="usuario">Usuario (para iniciar sesión)</label>
    <input type="text" id="usuario" name="usuario" value="{{ usuario }}" placeholder="AlexLz" autocomplete="off" autocapitalize="none" spellcheck="false" autofocus>
    <p class="ayuda" style="margin-top:-0.6rem;">Corto y sin espacios (letras, números, punto, guion). No importan las mayúsculas al entrar.</p>

    <label for="nombre">Nombre completo (se muestra en la bitácora y reportes)</label>
    <input type="text" id="nombre" name="nombre" value="{{ nombre }}" placeholder="Alex Lazo" autocomplete="off">

    <label for="rol">Rol</label>
    <select id="rol" name="rol">
      {% for r in roles_asignables %}
      <option value="{{ r }}" {% if rol == r %}selected{% endif %}>{{ ROLES[r] }}</option>
      {% endfor %}
    </select>

    <label for="password">Contraseña temporal (mínimo 8 caracteres)</label>
    <input type="password" id="password" name="password" autocomplete="new-password">

    <label for="confirmar">Confirma la contraseña</label>
    <input type="password" id="confirmar" name="confirmar" autocomplete="new-password">
    <p class="ayuda" style="margin-top:-0.6rem;">La persona deberá cambiarla por una propia la primera vez que entre.</p>

    <button type="submit">Crear usuario</button>
    <a class="boton secundario" href="{{ url_for('usuarios.listado') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
