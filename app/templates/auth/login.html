{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="tarjeta">
  <h2>Iniciar sesión</h2>
  <p class="ayuda">Entra con tu usuario (por ejemplo <strong>AlexLz</strong>); no importan las mayúsculas. Todo lo que registres después queda a tu nombre hasta que cierres sesión.</p>
  <form method="post">
    <label for="nombre">Usuario</label>
    <input type="text" id="nombre" name="nombre" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" autocomplete="current-password">

    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
