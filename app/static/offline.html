<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0b1120; color:#e8edf7; font-family:"Segoe UI",system-ui,sans-serif; text-align:center; padding:1.5rem; }
  main { max-width:340px; }
  h1 { font-size:1.5rem; margin:0 0 0.75rem; }
  p { color:#8b98b3; line-height:1.5; margin:0 0 1.5rem; }
  button { font-size:1rem; font-weight:600; padding:0.8rem 1.4rem; border:0; border-radius:10px; background:#3b82f6; color:#fff; }
</style>
</head>
<body>
<main>
  <h1>Sin conexión</h1>
  <p>No hay internet en este momento. Los escaneos no se guardan en el teléfono: espera a recuperar la conexión antes de registrar equipos.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
